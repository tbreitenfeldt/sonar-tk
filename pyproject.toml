[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sonartk"
authors = [
    {name = "Timothy Breitenfeldt", email = "timothyjb310@gmail.com"},
]
readme = "readme.md"
version = "0.1.2"
description = "A library used to create audio games built on top of Pyglet."
requires-python = ">=3.13"
keywords = ["development", "accessibility", "screen reader", "sonartk", "sonar tk"]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "accessible_output2",
    "pyglet",
    "pyperclip",
    "ijson",
    "pyogg",
]

[project.optional-dependencies]
test = [
    "build",
    "pytest",
    "pytest-mock",
    "pytest-cov",
]
dev = [
    "mypy",
    "flake8",
    "black",
    "pre-commit",
]

[project.urls]
repository = "https://github.com/tbreitenfeldt/sonar-tk"
bugtracker = "https://github.com/tbreitenfeldt/sonar-tk/issues"

[tool.black]
target-version = ['py313']
line-length = 79
include = "\\.pyi?$"
exclude = """
/(
    /.git
  | /.hg
  | /.mypy_cache
  | /.tox
  | /.venv
  | _build
  | buck-out
  | build
  | dist
)/
"""

[tool.mypy]
exclude = ["^.venv/", "^test/", "^src/sonartk/sound/openal_lite/"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "pyglet.*,pyperclip.*,accessible_output2.*,pyogg.*,ijson.*"
ignore_missing_imports = true
