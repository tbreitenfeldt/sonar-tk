repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
    - id: black
      language_version: python3.13

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
    - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
    -   id: mypy
        additional_dependencies: [accessible_output2, pyglet, pyperclip, ijson, pyogg]
        